<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Safe Walking In San Francisco" />
    <link rel="icon" href="data:," />
    <title>Safe Walking In San Francisco</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #fdf6e9;
        --veil-top: rgba(24, 20, 16, 0.18);
        --veil-bottom: rgba(24, 20, 16, 0.62);
        --rule: #e8a33d;
        --shadow: rgba(10, 8, 6, 0.55);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --veil-top: rgba(8, 7, 6, 0.34);
          --veil-bottom: rgba(8, 7, 6, 0.78);
        }
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        background: #17140f;
      }

      .hero {
        position: relative;
        min-height: 100svh;
        display: flex;
        align-items: flex-end;
        overflow: hidden;
        isolation: isolate;
      }

      .hero img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 58%;
        z-index: -2;
        animation: settle 14s ease-out both;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(to bottom, var(--veil-top), var(--veil-bottom));
      }

      .headline {
        padding: clamp(1.5rem, 6vw, 4.5rem);
        padding-bottom: clamp(2.5rem, 9vh, 5.5rem);
      }

      .headline::before {
        content: "";
        display: block;
        width: clamp(3rem, 8vw, 5.5rem);
        height: 3px;
        background: var(--rule);
        margin-bottom: clamp(1rem, 3vh, 1.75rem);
      }

      h1 {
        margin: 0;
        color: var(--ink);
        font-weight: 600;
        font-size: clamp(2.6rem, 8.5vw, 6.75rem);
        line-height: 1.02;
        letter-spacing: -0.015em;
        text-shadow: 0 2px 30px var(--shadow), 0 1px 3px var(--shadow);
      }

      h1 .line, h1 .place {
        display: block;
        white-space: nowrap;
      }

      h1 .place {
        font-style: italic;
        font-weight: 500;
      }

      @keyframes settle {
        from { transform: scale(1.06); }
        to { transform: scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero img { animation: none; }
      }
    </style>
  </head>
